<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Monitor - Satellite Tracker 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.6rem;
            color: #04d361;
        }

        .status {
            font-size: 0.85rem;
            color: #a8a8b3;
            margin-bottom: 20px;
        }

        .video-container {
            width: 100%;
            max-width: 720px;
            background-color: #000000;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 2px solid #29292e;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .hint {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #737380;
        }
    </style>
</head>

<body>

    <h1>Live CCTV Station</h1>
    <div class="status">Source: Low-Latency HLS Stream</div>

    <div class="video-container">
        <video id="cctv-player" controls autoplay muted playsinline></video>
    </div>

    <div class="hint">Pastikan backend FFmpeg sedang berjalan untuk memperbarui file stream.</div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var video = document.getElementById('cctv-player');

            // Diarahkan ke URL relatif server web (folder public dipetakan ke '/')
            var videoSrc = '/cctv/stream.m3u8';

            // Integrasi untuk browser umum menggunakan Hls.js
            if (Hls.isSupported()) {
                var hls = new Hls({
                    maxLiveSyncPlaybackRate: 1.5,
                    liveSyncDurationCount: 3
                });

                hls.loadSource(videoSrc);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(function (err) {
                        console.log("Autoplay ditangguhkan, menunggu interaksi pengguna.", err);
                    });
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log('Masalah jaringan, mencoba memuat ulang segmen...');
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log('Masalah media, mencoba memulihkan buffer...');
                                hls.recoverMediaError();
                                break;
                            default:
                                console.log('Error tidak dapat dipulihkan secara otomatis.');
                                break;
                        }
                    }
                });
            }
            // Integrasi native untuk Safari / iOS macOS
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
            }
        });
    </script>

</body>

</html>
