services:
  # ── Next.js Web App + WebSocket Bridge (port 3000 & 3002) ──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbit-tracker-app
    restart: unless-stopped
    ports:
      - "3000:3000"   # Next.js HTTP
      - "3002:3002"   # WebSocket bridge (for local-agent connection)
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # ── Optional: override Celestrak API base if needed ──
      # - CELESTRAK_BASE_URL=https://celestrak.org
    volumes:
      # Persist satellite TLE cache across restarts so it does not re-download on every boot
      - satellite_cache:/app/active-satellites-cache.json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || wget -qO- http://localhost:3000/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  satellite_cache:
    driver: local
