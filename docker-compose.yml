services:
  # ── Next.js Web App + WebSocket Bridge (port 3003 & 3004) ──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbit-tracker-app
    restart: unless-stopped
    ports:
      - "3003:3003"   # Next.js HTTP
      - "3004:3004"   # WebSocket bridge (for local-agent connection)
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3003
      - WS_PORT=3004
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/ >/dev/null 2>&1 && echo ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

